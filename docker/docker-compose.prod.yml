# Produção (POC): Cloudflare (Full strict) → Caddy (443) → web/api. Postgres e apps SEM porta no host
# (só o Caddy publica 80/443). Variáveis sensíveis vêm de docker/.env (fora do git).
#
# Uso (a partir da pasta docker/):
#   docker compose -f docker-compose.prod.yml up -d --build
# Ver docs/deploy.md para o passo a passo (Cloudflare, cert de origem, .env, firewall).

# Nome explícito do projeto Compose. SEM ele, o Compose usa o nome da PASTA do arquivo
# ("docker") — igual em todo projeto derivado desta base — e um `up` aqui recriaria os
# containers do outro projeto por cima. Ao renomear o projeto, renomeie também este nome.
name: retaguarda-base

services:
  postgres:
    container_name: retaguarda-base-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [retaguarda-base]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: retaguarda-base-web
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Persiste as chaves de Data Protection no volume (mantém cookies/antiforgery entre restarts).
      DataProtection__KeysPath: /app/keys
      AllowedHosts: ${WEB_ALLOWED_HOSTS}
      # Admin inicial criado no 1º boot (idempotente; não redefine a senha depois). Ver docs/deploy.md.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../logs/web:/app/logs
      - web-dataprotection-keys:/app/keys
    networks: [retaguarda-base]

  api:
    container_name: retaguarda-base-api
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Chave de assinatura do JWT (>= 32 bytes) — obrigatória em produção. Ver .env.example.
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      AllowedHosts: ${API_ALLOWED_HOSTS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../logs/api:/app/logs
    networks: [retaguarda-base]

  caddy:
    container_name: retaguarda-base-caddy
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro          # coloque aqui o cert de origem da Cloudflare (origin.pem/origin-key.pem)
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
    networks: [retaguarda-base]

networks:
  retaguarda-base:
    driver: bridge
    name: retaguarda-base

volumes:
  web-dataprotection-keys:
    name: retaguarda-base-web-dataprotection-keys
  postgres-data:
    name: retaguarda-base-postgres-data
  caddy-data:
    name: retaguarda-base-caddy-data
  caddy-config:
    name: retaguarda-base-caddy-config
